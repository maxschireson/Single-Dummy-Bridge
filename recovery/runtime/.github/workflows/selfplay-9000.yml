name: Collect 9000 additional self-play deals

on:
  push:
    branches: [research/selfplay-training-2026-11-08]
    paths: [.github/workflows/selfplay-9000.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfplay-9000-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        chunk: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate
        run: |
          python -m pip install -e '.[loop]'
          python scripts/build_dds.py
          python -m unittest discover -s tests -v
      - name: Collect 1000 independent deals at 32 samples
        env:
          CHUNK: ${{ matrix.chunk }}
        run: |
          python -m bridge_harness.selfplay --count 1000 --workers 4 --samples 32 \
            --objective tricks --near-tie 0.125 \
            --deal-seed "$((20261110 + CHUNK))" --seed "$((9173 + 1000 * CHUNK))" \
            --out "data/chunk-${CHUNK}"
      - name: Export splits and check completion
        env:
          CHUNK: ${{ matrix.chunk }}
        run: |
          for split in train validation test; do
            python -m bridge_harness.selfplay --out "data/chunk-${CHUNK}" \
              --export "$split" --export-path "data/chunk-${CHUNK}/${split}.npz"
          done
          python -c 'import json,os; s=json.load(open("data/chunk-"+os.environ["CHUNK"]+"/summary.json")); assert s["games"]==1000 and s["failures"]==0, s'
      - name: Preserve data and failure records outside Git
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfplay-32-chunk-${{ matrix.chunk }}
          path: data/chunk-${{ matrix.chunk }}/
          retention-days: 7
          if-no-files-found: error
