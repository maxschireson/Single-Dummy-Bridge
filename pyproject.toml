[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge-harness"
version = "0.1.0"
description = "Reproducible single-dummy bridge experiments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bridge-harness = "bridge_harness.cli:main"

[tool.setuptools.packages.find]
include = ["bridge_harness*"]
